<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neighborly</title>
<style>
:root{--g:#16a34a;--g2:#15803d;--gl:#dcfce7;--bg:#f2f4f3;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--in:#f3f4f6;--sh:0 4px 14px rgba(0,0,0,.07);--red:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f0d;--card:#1a1f1d;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2b322f;--in:#252b28;--gl:#14532d;--sh:0 4px 14px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0f0d;--card:#1a1f1d;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2b322f;--in:#252b28;--gl:#14532d;--sh:0 4px 14px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center}
#phone{position:relative;width:100%;max-width:390px;height:100%;max-height:844px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:500px){#phone{border-radius:44px;border:10px solid #111;box-shadow:0 24px 60px rgba(0,0,0,.35);height:min(844px,96vh)}}
.screen{position:absolute;inset:0 0 76px 0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateX(24px);transition:opacity .25s,transform .25s;background:var(--bg)}
.screen.active{opacity:1;pointer-events:auto;transform:none;z-index:2}
.scroll{flex:1;overflow-y:auto;padding:0 16px 20px}
.top{padding:16px 16px 8px;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:22px;letter-spacing:-.4px;color:var(--g)}
.loc{font-size:12px;color:var(--mu)}
.sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);font-size:18px;cursor:pointer;position:relative;color:var(--tx)}
.dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
.search{margin:6px 16px 10px;background:var(--card);border-radius:16px;box-shadow:var(--sh);display:flex;align-items:center;padding:0 14px;gap:8px}
.search input{flex:1;border:0;background:none;padding:13px 0;font-size:15px;outline:none;color:var(--tx)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}
.chip{flex:none;border:0;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--tx);font-size:13px;font-weight:600;box-shadow:var(--sh);cursor:pointer}
.chip.on{background:var(--g);color:#fff}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:14px;margin-bottom:12px;display:flex;gap:12px;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.98)}
.ico{flex:none;width:48px;height:48px;border-radius:16px;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:24px}
.cb{flex:1;min-width:0}
.ct{font-weight:700;font-size:15px;line-height:1.25;margin-bottom:3px}
.meta{font-size:12px;color:var(--mu);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.price{font-weight:800;color:var(--g);font-size:15px;white-space:nowrap}
.badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.4px}
.urg{background:#fee2e2;color:var(--red)}
.ver{background:var(--gl);color:var(--g)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
.hd{display:flex;align-items:center;gap:10px;padding:14px 16px}
.hd h2{margin:0;font-size:18px;flex:1}
.back{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);font-size:18px;cursor:pointer;color:var(--tx)}
.box{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.av{width:44px;height:44px;border-radius:50%;background:var(--g);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;background:var(--g);color:#fff;margin-bottom:10px}
.btn:active{background:var(--g2)}
.btn.sec{background:var(--gl);color:var(--g)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;margin:0;border-radius:12px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
input.f,select.f,textarea.f{width:100%;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:12px;font-size:15px;font-family:inherit;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--g)}
.chk{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--g)}
.msgs{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.35;animation:pop .2s}
.m.me{align-self:flex-end;background:var(--g);color:#fff;border-bottom-right-radius:5px}
.m.them{align-self:flex-start;background:var(--card);box-shadow:var(--sh);border-bottom-left-radius:5px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.cin{display:flex;gap:8px;padding:10px 16px}
.cin input{flex:1;border:0;background:var(--card);box-shadow:var(--sh);border-radius:999px;padding:12px 16px;font-size:15px;outline:none;color:var(--tx)}
.cin button{width:44px;height:44px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:18px;cursor:pointer}
.sec-t{font-size:13px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:12px 6px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--g)}
.stat span{font-size:11px;color:var(--mu)}
.bdg{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:16px;box-shadow:var(--sh);margin-bottom:8px;font-size:14px;font-weight:600}
nav{position:absolute;left:0;right:0;bottom:0;height:76px;background:var(--card);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-around;padding:0 6px;z-index:5}
.tab{flex:1;border:0;background:none;color:var(--mu);font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 0}
.tab i{font-style:normal;font-size:22px}
.tab.on{color:var(--g)}
.plus{flex:none;width:58px;height:58px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:30px;line-height:1;margin-top:-26px;box-shadow:0 6px 16px rgba(22,163,74,.5);cursor:pointer}
.plus:active{transform:scale(.93)}
#toast{position:absolute;left:50%;top:18px;transform:translate(-50%,-90px);background:#111;color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;transition:transform .35s cubic-bezier(.2,1.2,.4,1);max-width:90%;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.3)}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="phone">
<div id="toast"></div>

<section class="screen active" id="home">
  <div class="top"><div><h1>Neighborly</h1><div class="loc">📍 Al-Noor District, Riyadh</div></div><div class="sp"></div><button class="ib" id="bell" aria-label="Notifications">🔔<span class="dot"></span></button></div>
  <div class="search">🔍<input id="q" placeholder="Search requests…" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
  <div class="scroll" id="feed"></div>
</section>

<section class="screen" id="details">
  <div class="hd"><button class="back" data-go="home">‹</button><h2>Request Details</h2></div>
  <div class="scroll" id="dbody"></div>
</section>

<section class="screen" id="new">
  <div class="hd"><button class="back" data-go="home">‹</button><h2>New Request</h2></div>
  <div class="scroll">
    <div class="box">
      <label style="margin-top:0">Title</label><input class="f" id="nt" placeholder="e.g. Help assembling a wardrobe">
      <label>Category</label><select class="f" id="nc"></select>
      <label>Description</label><textarea class="f" id="nd" rows="3" placeholder="Tell neighbors what you need…"></textarea>
      <label>Price (SAR)</label><input class="f" id="np" type="number" min="1" inputmode="numeric" placeholder="80">
      <label>When</label><select class="f" id="nw"><option>Now</option><option>Today</option><option>Tomorrow</option><option>This week</option></select>
      <div class="chk"><input type="checkbox" id="nu"><label style="margin:0">Mark as urgent</label></div>
      <button class="btn" id="submit" style="margin:0">Post Request</button>
    </div>
  </div>
</section>

<section class="screen" id="chat">
  <div class="hd"><button class="back" data-go="home">‹</button><div class="av" id="cav">A</div><div style="flex:1"><h2 id="cname" style="font-size:16px">Ahmed</h2><div class="loc">● Online</div></div></div>
  <div class="msgs" id="msgs"></div>
  <div class="cin"><input id="ci" placeholder="Type a message…" autocomplete="off"><button id="send" aria-label="Send">➤</button></div>
</section>

<section class="screen" id="mine">
  <div class="hd"><h2 style="font-size:22px">My Requests</h2></div>
  <div class="scroll" id="mbody"></div>
</section>

<section class="screen" id="profile">
  <div class="hd"><h2 style="font-size:22px">Profile</h2><button class="ib" id="gear" aria-label="Settings">⚙️</button></div>
  <div class="scroll">
    <div class="box" style="text-align:center">
      <div class="av" style="width:84px;height:84px;font-size:32px;margin:0 auto 10px">YU</div>
      <div style="font-size:20px;font-weight:800">Yousef Alharbi</div>
      <div class="meta" style="justify-content:center;margin-top:4px">⭐ 4.9 · 37 reviews</div>
    </div>
    <div class="stats"><div class="stat"><b>23</b><span>Services completed</span></div><div class="stat"><b>12</b><span>Requests posted</span></div><div class="stat"><b>98%</b><span>On-time</span></div></div>
    <div class="sec-t">Trust badges</div>
    <div class="bdg"><span style="font-size:24px">🥇</span>Gold Helper</div>
    <div class="bdg"><span style="font-size:24px">⚡</span>Fast Responder</div>
    <div class="bdg"><span style="font-size:24px">✅</span>Verified</div>
    <button class="btn sec" id="settings" style="margin-top:12px">Settings</button>
  </div>
</section>

<nav>
  <button class="tab on" data-go="home"><i>🏠</i>Home</button>
  <button class="tab" data-go="mine"><i>📋</i>Requests</button>
  <button class="plus" data-go="new" aria-label="New Request">+</button>
  <button class="tab" data-go="chat"><i>💬</i>Chat</button>
  <button class="tab" data-go="profile"><i>👤</i>Profile</button>
</nav>
</div>

<script>
var CATS={Moving:"🚚",Repairs:"🔧",Tutoring:"📚",Gardening:"🌳",Cleaning:"🧹"};
var SEED=[
{id:1,title:"Moving furniture between apartments",cat:"Moving",name:"Ahmed",rating:4.8,dist:"500m",time:"10 min ago",price:120,urgent:true,desc:"Need two strong hands to move a sofa, bed frame and a few boxes to a new apartment in the same building complex. Ground-floor lift available."},
{id:2,title:"Installing curtains and shelves",cat:"Repairs",name:"Sarah",rating:4.9,dist:"1.2km",time:"1 hr ago",price:60,desc:"Looking for someone with a drill to hang curtain rods in two rooms and mount three floating shelves. I have all the hardware."},
{id:3,title:"Math tutoring for high schooler",cat:"Tutoring",name:"Khalid",rating:5.0,dist:"800m",time:"3 hrs ago",price:80,verified:true,desc:"My son is in grade 11 and needs help with algebra and trigonometry before exams. One hour sessions, twice a week."},
{id:4,title:"Tree trimming and garden care",cat:"Gardening",name:"Noura",rating:4.7,dist:"2km",time:"5 hrs ago",price:90,desc:"Two palm trees and a hedge need trimming, plus general lawn tidy-up. Tools can be provided."},
{id:5,title:"Deep cleaning apartment",cat:"Cleaning",name:"Fahad",rating:4.6,dist:"1.5km",time:"Yesterday",price:150,desc:"Three-bedroom apartment needs a full deep clean including kitchen and bathrooms before guests arrive."}];
var DONE=[{id:101,title:"Fixing a leaking kitchen tap",cat:"Repairs",price:50,status:"done"},{id:102,title:"Helping carry groceries upstairs",cat:"Moving",price:20,status:"done"}];
var $=function(s){return document.querySelector(s)},$$=function(s){return Array.from(document.querySelectorAll(s))};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var KEY="neighborly.requests.v1",KEY2="neighborly.accepted.v1";
function load(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var posted=load(KEY),accepted=load(KEY2),cat="All",nid=1000,cur=null;
posted.forEach(function(p){nid=Math.max(nid,p.id+1)});
var all=function(){return posted.concat(SEED)};

function toast(t){var el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("show")},2200)}
function go(id){
  $$(".screen").forEach(function(s){s.classList.toggle("active",s.id===id)});
  var tabOf={home:"home",details:"home",new:"new",chat:"chat",mine:"mine",profile:"profile"}[id];
  $$(".tab").forEach(function(t){t.classList.toggle("on",t.dataset.go===tabOf)});
  if(id==="mine")renderMine();
  if(id==="chat")openChat(cur?cur.name:"Ahmed");
}
document.addEventListener("click",function(e){var b=e.target.closest("[data-go]");if(b)go(b.dataset.go)});

/* Home */
function renderChips(){
  var names=["All"].concat(Object.keys(CATS));
  $("#chips").innerHTML=names.map(function(n){return '<button class="chip'+(n===cat?" on":"")+'" data-c="'+n+'">'+(CATS[n]||"✨")+" "+n+"</button>"}).join("");
  $$(".chip").forEach(function(c){c.onclick=function(){cat=c.dataset.c;renderChips();renderFeed()}});
}
function card(r){
  return '<div class="card" data-id="'+r.id+'"><div class="ico">'+CATS[r.cat]+'</div><div class="cb"><div class="ct">'+esc(r.title)+'</div>'+
  '<div class="meta"><span>'+esc(r.name)+'</span><span>⭐ '+Number(r.rating).toFixed(1)+'</span>'+(r.verified?'<span class="badge ver">✓ VERIFIED</span>':'')+'</div>'+
  '<div class="row"><div class="meta"><span>📍 '+esc(r.dist)+'</span><span>🕒 '+esc(r.time)+'</span>'+(r.urgent?'<span class="badge urg">URGENT</span>':'')+'</div><div class="price">'+r.price+' SAR</div></div></div></div>';
}
function renderFeed(){
  var q=$("#q").value.trim().toLowerCase();
  var list=all().filter(function(r){return(cat==="All"||r.cat===cat)&&r.title.toLowerCase().indexOf(q)>-1});
  $("#feed").innerHTML=list.length?list.map(card).join(""):'<div class="empty">😕<br>No requests found</div>';
  $$("#feed .card").forEach(function(c){c.onclick=function(){openDetails(+c.dataset.id)}});
}
$("#q").oninput=renderFeed;
$("#bell").onclick=function(){var d=$("#bell .dot");if(d){d.remove();toast("🔔 Sarah replied to your request")}else toast("No new notifications")};

/* Details */
function find(id){return all().filter(function(r){return r.id===id})[0]}
function openDetails(id){
  var r=find(id);cur=r;var got=accepted.indexOf(id)>-1;
  $("#dbody").innerHTML='<div class="box"><div style="display:flex;gap:12px;align-items:center"><div class="ico">'+CATS[r.cat]+'</div><div><div class="ct" style="font-size:17px">'+esc(r.title)+'</div><div class="meta"><span>'+r.cat+'</span><span>🕒 '+esc(r.time)+'</span>'+(r.urgent?'<span class="badge urg">URGENT</span>':'')+'</div></div></div></div>'+
  '<div class="box" style="display:flex;gap:12px;align-items:center"><div class="av">'+esc(r.name[0])+'</div><div style="flex:1"><b>'+esc(r.name)+'</b>'+(r.verified?' <span class="badge ver">✓ VERIFIED</span>':'')+'<div class="meta">⭐ '+Number(r.rating).toFixed(1)+' · 📍 '+esc(r.dist)+' away</div></div></div>'+
  '<div class="box"><div class="sec-t" style="margin-top:0">Description</div><div style="font-size:14px;line-height:1.5">'+esc(r.desc||"No description provided.")+'</div></div>'+
  '<div class="box" style="display:flex;justify-content:space-between;align-items:center"><span class="meta" style="font-size:14px">Proposed price</span><span class="price" style="font-size:24px">'+r.price+' SAR</span></div>'+
  '<button class="btn" id="acc"'+(got?' disabled style="opacity:.6"':'')+'>'+(got?"✓ Accepted":"Accept Request")+'</button><button class="btn sec" id="msg">💬 Message Requester</button>';
  $("#acc").onclick=function(){if(r.name==="You"){toast("This is your own request");return}accepted.push(r.id);save(KEY2,accepted);toast("✅ Request accepted!");openDetails(r.id)};
  $("#msg").onclick=function(){go("chat")};
  go("details");
}

/* New */
$("#nc").innerHTML=Object.keys(CATS).map(function(c){return"<option>"+c+"</option>"}).join("");
$("#submit").onclick=function(){
  var t=$("#nt").value.trim(),p=parseInt($("#np").value,10);
  if(!t){toast("Please add a title");return}
  if(!p||p<1){toast("Please enter a valid price");return}
  var w=$("#nw").value;
  var r={id:nid++,title:t,cat:$("#nc").value,name:"You",rating:4.9,dist:"Your place",time:w==="Now"?"Just now":w,price:p,urgent:$("#nu").checked,desc:$("#nd").value.trim()};
  posted.unshift(r);save(KEY,posted);
  ["#nt","#nd","#np"].forEach(function(s){$(s).value=""});$("#nu").checked=false;
  cat="All";$("#q").value="";renderChips();renderFeed();$("#feed").scrollTop=0;
  go("home");toast("🎉 Request posted!");
};

/* My requests */
function renderMine(){
  var active=posted.map(function(r){return{id:r.id,title:r.title,cat:r.cat,price:r.price,status:r.done?"done":"open",own:true}})
    .concat(accepted.map(function(id){var r=find(id);return r&&{id:id,title:r.title,cat:r.cat,price:r.price,status:"active"}}).filter(Boolean));
  var act=active.filter(function(r){return r.status!=="done"}),done=DONE.concat(active.filter(function(r){return r.status==="done"}));
  var row=function(r,btn){return '<div class="card" style="cursor:default"><div class="ico">'+CATS[r.cat]+'</div><div class="cb"><div class="ct">'+esc(r.title)+'</div><div class="row"><span class="badge '+(r.status==="done"?"ver":"urg")+'" style="'+(r.status==="done"?"":"background:#fef9c3;color:#a16207")+'">'+(r.status==="done"?"COMPLETED":r.status==="open"?"OPEN":"IN PROGRESS")+'</span><span class="price">'+r.price+' SAR</span></div>'+(btn?'<div class="row"><span></span><button class="btn sm" data-done="'+r.id+'">Mark complete</button></div>':'')+'</div></div>'};
  $("#mbody").innerHTML='<div class="sec-t" style="margin-top:0">Active ('+act.length+')</div>'+(act.length?act.map(function(r){return row(r,true)}).join(""):'<div class="empty" style="padding:20px 0">Nothing active yet.<br>Post a request or accept one!</div>')+
    '<div class="sec-t">Completed ('+done.length+')</div>'+done.map(function(r){return row(r,false)}).join("");
  $$("[data-done]").forEach(function(b){b.onclick=function(){var id=+b.dataset.done;var p=posted.filter(function(x){return x.id===id})[0];
    if(p){p.done=true;save(KEY,posted)}else{accepted=accepted.filter(function(x){return x!==id});save(KEY2,accepted);var r=find(id);DONE.unshift({id:id,title:r.title,cat:r.cat,price:r.price,status:"done"})}
    toast("✅ Marked as complete");renderMine()}});
}

/* Chat */
var threads={},REPLIES=["Thanks for reaching out! 😊","Sure, that works for me.","I can be there in about 20 minutes.","Could you share the exact address?","Sounds great, see you then!","Perfect, let me confirm and get back to you."];
var who="Ahmed";
function openChat(name){
  who=name;$("#cname").textContent=name;$("#cav").textContent=name[0];
  if(!threads[name])threads[name]=[{me:false,t:"Hi! Thanks for your interest. When can you help?"}];
  drawMsgs();
}
function drawMsgs(){var el=$("#msgs");el.innerHTML=threads[who].map(function(m){return'<div class="m '+(m.me?"me":"them")+'">'+esc(m.t)+"</div>"}).join("");el.scrollTop=el.scrollHeight}
function sendMsg(){
  var i=$("#ci"),t=i.value.trim();if(!t)return;
  var name=who;threads[name].push({me:true,t:t});i.value="";drawMsgs();
  setTimeout(function(){threads[name].push({me:false,t:REPLIES[Math.floor(Math.random()*REPLIES.length)]});if(who===name&&$("#chat").classList.contains("active"))drawMsgs()},1000);
}
$("#send").onclick=sendMsg;
$("#ci").onkeydown=function(e){if(e.key==="Enter")sendMsg()};

/* Profile */
$("#gear").onclick=$("#settings").onclick=function(){toast("⚙️ Settings coming soon")};

renderChips();renderFeed();
</script>
</body>
</html>
